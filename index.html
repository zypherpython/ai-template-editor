<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AI Template Editor</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,sans-serif;min-height:100vh;display:flex;flex-direction:column;color:#1a1a1a;background:#f9fafb}
header{text-align:center;padding:2rem 1rem 1rem}
header h1{font-size:1.5rem;font-weight:700}
main{flex:1;display:flex;flex-direction:column;align-items:center;gap:2rem;padding:0 1rem 2rem;max-width:48rem;margin:0 auto;width:100%}
.dropzone{border:2px dashed #d1d5db;border-radius:0.75rem;padding:3rem 1rem;text-align:center;cursor:pointer;transition:all .2s;width:100%}
.dropzone:hover{border-color:#9ca3af}
.dropzone.dragover{border-color:#3b82f6;background:#eff6ff}
.dropzone.disabled{opacity:.5;pointer-events:none}
.dropzone p{color:#6b7280;font-size:1.125rem}
.dropzone .sub{color:#9ca3af;font-size:.875rem;margin-top:.5rem}
input[type="file"]{display:none}
.spinner{color:#6b7280;font-size:.875rem}
.alert{padding:1rem;border-radius:.5rem;width:100%;max-width:48rem}
.alert-error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.alert-warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;text-align:center}
.editor-area{display:flex;flex-direction:column;align-items:center;gap:1.5rem;width:100%}
.editor-area .badge{font-size:.75rem;color:#9ca3af;align-self:flex-start}
.image-container{position:relative;display:inline-block;width:100%}
.image-container img{width:100%;height:auto;display:block}
.placeholder-box{position:absolute;border:2px solid #3b82f6;cursor:pointer;transition:background .2s,border-color .2s}
.placeholder-box:hover{background:rgba(59,130,246,.2)}
.placeholder-box.filled{border-color:transparent}
.placeholder-box.filled:hover{border-color:rgba(255,255,255,.6)}
.placeholder-plus{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:#3b82f6;font-size:1.5rem;font-weight:700;opacity:.6;pointer-events:none}
.placeholder-filled{position:absolute;object-fit:cover;cursor:pointer}
.placeholder-label{position:absolute;background:#3b82f6;color:#fff;font-size:.75rem;padding:2px 4px;border-radius:4px;pointer-events:none;white-space:nowrap}
.download-btn{background:#16a34a;color:#fff;font-weight:500;padding:.5rem 1.5rem;border:none;border-radius:.5rem;cursor:pointer;transition:background .2s}
.download-btn:hover{background:#15803d}
details{width:100%;max-width:48rem}
details summary{cursor:pointer;font-size:.875rem;color:#6b7280;font-weight:500}
details pre{margin-top:.5rem;background:#f3f4f6;border-radius:.5rem;padding:1rem;font-size:.75rem;overflow-x:auto}
</style>
</head>
<body>
<header><h1>AI Template Editor</h1></header>
<main id="app">
  <div id="dropzone" class="dropzone">
    <p>Drop a template image here, or click to browse</p>
    <p class="sub">JPEG, PNG, or WebP</p>
    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp"/>
  </div>
  <div id="status"></div>
  <div id="error"></div>
  <div id="result"></div>
</main>
<script>
(function(){
  function grayscale(data) {
    const gray = new Uint8Array(data.length / 4);
    for (let i = 0; i < gray.length; i++) {
      const j = i * 4;
      gray[i] = (76 * data[j] + 150 * data[j+1] + 29 * data[j+2]) >> 8;
    }
    return gray;
  }
  function sobelSeparated(gray, w, h) {
    const gx = new Float32Array(gray.length), gy = new Float32Array(gray.length), mag = new Float32Array(gray.length);
    for (let y = 1; y < h - 1; y++) {
      const ra = (y-1)*w, r = y*w, rb = (y+1)*w;
      for (let x = 1; x < w - 1; x++) {
        gx[r+x] = -gray[ra+x-1] + gray[ra+x+1] - 2*gray[r+x-1] + 2*gray[r+x+1] - gray[rb+x-1] + gray[rb+x+1];
        gy[r+x] = -gray[ra+x-1] - 2*gray[ra+x] - gray[ra+x+1] + gray[rb+x-1] + 2*gray[rb+x] + gray[rb+x+1];
        mag[r+x] = Math.sqrt(gx[r+x]*gx[r+x] + gy[r+x]*gy[r+x]);
      }
    }
    return {gx, gy, mag};
  }
  function sumRect(integral, w, x1, y1, x2, y2) {
    const s = w+1; return integral[y2*s+x2] - integral[y1*s+x2] - integral[y2*s+x1] + integral[y1*s+x1];
  }
  function buildIntegral(data, w, h) {
    const integral = new Float64Array((w+1)*(h+1));
    for (let y = 0; y < h; y++) {
      const rowOut = (y+1)*(w+1)+1, rowIn = y*w, rowAbove = y*(w+1)+1;
      for (let x = 0; x < w; x++) integral[rowOut+x] = data[rowIn+x] + integral[rowAbove+x] + integral[rowOut+x-1] - integral[rowAbove+x-1];
    }
    return integral;
  }
  function findLines(projection, length, threshold, minGap, minLength) {
    const lines = [];
    let inLine = false, start = 0, maxVal = 0;
    for (let i = 0; i < length; i++) {
      if (projection[i] >= threshold) {
        if (!inLine) { start = i; maxVal = 0; inLine = true; }
        if (projection[i] > maxVal) maxVal = projection[i];
      } else if (inLine) {
        if (i - start >= minLength) lines.push({start, end: i-1, strength: maxVal});
        inLine = false;
      }
    }
    if (inLine && length - start >= minLength) lines.push({start, end: length-1, strength: maxVal});
    if (lines.length < 2) return lines;
    const merged = [];
    let cur = lines[0];
    for (let i = 1; i < lines.length; i++) {
      if (lines[i].start - cur.end <= minGap) { cur = {start: cur.start, end: lines[i].end, strength: Math.max(cur.strength, lines[i].strength)}; }
      else { merged.push(cur); cur = lines[i]; }
    }
    merged.push(cur);
    return merged;
  }
  function rectOverlap(a, b) {
    const xi1 = Math.max(a.x, b.x), yi1 = Math.max(a.y, b.y);
    const xi2 = Math.min(a.x+a.bw, b.x+b.bw), yi2 = Math.min(a.y+a.bh, b.y+b.bh);
    const inter = Math.max(0, xi2-xi1) * Math.max(0, yi2-yi1);
    const u = a.bw*a.bh + b.bw*b.bh - inter;
    return u > 0 ? inter / u : 0;
  }
  function nms(rects, thresh) {
    if (thresh === undefined) thresh = 0.35;
    if (rects.length === 0) return [];
    const sorted = [...rects].sort((a,b)=>b.score-a.score);
    const kept = [];
    for (const r of sorted) { let overlap = false; for (const k of kept) { if (rectOverlap(r,k) > thresh) { overlap = true; break; } } if (!overlap) kept.push(r); }
    return kept;
  }
  function detectByLines(gx, gy, edgeInt, grayInt, w, h, ow, oh, imgArea) {
    const edgeMean = sumRect(edgeInt, w, 0, 0, w, h) / imgArea;
    const threshold = edgeMean * 1.2 + 3;
    const hProj = new Float32Array(h), vProj = new Float32Array(w);
    for (let y = 0; y < h; y++) { let s = 0; for (let x = 0; x < w; x++) s += gy[y*w+x]; hProj[y] = s / w; }
    for (let x = 0; x < w; x++) { let s = 0; for (let y = 0; y < h; y++) s += gx[y*w+x]; vProj[x] = s / h; }
    const minLen = Math.round(Math.min(w,h)*0.03), gap = Math.round(Math.min(w,h)*0.015);
    const hLines = findLines(hProj, h, threshold, gap, minLen);
    const vLines = findLines(vProj, w, threshold, gap, minLen);
    const candidates = [];
    for (let hi = 0; hi < hLines.length; hi++) {
      for (let hj = hi+1; hj < hLines.length; hj++) {
        for (let vi = 0; vi < vLines.length; vi++) {
          for (let vj = vi+1; vj < vLines.length; vj++) {
            const y1 = hLines[hi].start, y2 = hLines[hj].end, x1 = vLines[vi].start, x2 = vLines[vj].end;
            let bh = y2-y1+1, bw = x2-x1+1;
            if (bh < 5 || bw < 5) continue;
            const area = bw*bh;
            if (area < 0.003*imgArea || area > 0.7*imgArea) continue;
            const aspect = bw/bh;
            if (aspect < 0.3 || aspect > 4) continue;
            const perimCount = 2*(bw+bh);
            const perimEdge = (sumRect(edgeInt,w,x1,y1,x2+1,y1+1)+sumRect(edgeInt,w,x1,y2,x2+1,y2+1)+sumRect(edgeInt,w,x1,y1,x1+1,y2+1)+sumRect(edgeInt,w,x2,y1,x2+1,y2+1))/perimCount;
            const interiorCount = Math.max(1,(bh-2)*(bw-2));
            const avgEdge = sumRect(edgeInt,w,x1+1,y1+1,x2,y2)/interiorCount;
            const avgBright = sumRect(grayInt,w,x1+1,y1+1,x2,y2)/interiorCount;
            const ox1 = Math.max(0,x1-3), oy1 = Math.max(0,y1-3), ox2 = Math.min(w,x2+4), oy2 = Math.min(h,y2+4);
            let borderContrast = 0;
            if ((ox2-ox1) > bw+2 && (oy2-oy1) > bh+2) {
              const outArea = (ox2-ox1)*(oy2-oy1), innerArea = bw*bh;
              if (outArea > innerArea) {
                const outSum = sumRect(grayInt,w,ox1,oy1,ox2,oy2), innerSum = sumRect(grayInt,w,x1,y1,x2+1,y2+1);
                const bgBright = (outSum-innerSum)/(outArea-innerArea);
                borderContrast = bgBright > 0 ? Math.abs(avgBright-bgBright)/Math.max(avgBright,bgBright,1) : 0;
              }
            }
            const lineScore = Math.min(1,Math.max(hLines[hi].strength,hLines[hj].strength)/30)*Math.min(1,Math.max(vLines[vi].strength,vLines[vj].strength)/30);
            const eScore = Math.min(1, perimEdge/80);
            const interiorPenalty = Math.max(0, 1-avgEdge/120);
            const cScore = Math.min(1, borderContrast*3);
            const score = lineScore*0.25 + eScore*0.25 + interiorPenalty*0.20 + cScore*0.30;
            if (score > 0.20) candidates.push({x:x1*ow/w, y:y1*oh/h, bw:bw*ow/w, bh:bh*oh/h, score});
          }
        }
      }
    }
    return candidates;
  }
  function detectByContent(data, edgeInt, w, h, ow, oh, imgArea) {
    const ch = [
      {sum: new Float64Array((w+1)*(h+1)), sumSq: new Float64Array((w+1)*(h+1))},
      {sum: new Float64Array((w+1)*(h+1)), sumSq: new Float64Array((w+1)*(h+1))},
      {sum: new Float64Array((w+1)*(h+1)), sumSq: new Float64Array((w+1)*(h+1))},
    ];
    const stride = w+1;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y*w+x)*4, idx = (y+1)*stride+(x+1), above = y*stride+(x+1), left = (y+1)*stride+x, diag = y*stride+x;
        for (let c = 0; c < 3; c++) {
          const val = data[i+c];
          ch[c].sum[idx] = val + ch[c].sum[above] + ch[c].sum[left] - ch[c].sum[diag];
          ch[c].sumSq[idx] = val*val + ch[c].sumSq[above] + ch[c].sumSq[left] - ch[c].sumSq[diag];
        }
      }
    }
    function varRect(x1,y1,x2,y2) {
      const n = Math.max(1,(x2-x1)*(y2-y1));
      let v = 0;
      for (let c = 0; c < 3; c++) {
        const s = ch[c].sum[y2*stride+x2]-ch[c].sum[y1*stride+x2]-ch[c].sum[y2*stride+x1]+ch[c].sum[y1*stride+x1];
        const sq = ch[c].sumSq[y2*stride+x2]-ch[c].sumSq[y1*stride+x2]-ch[c].sumSq[y2*stride+x1]+ch[c].sumSq[y1*stride+x1];
        v += sq/n - (s/n)*(s/n);
      }
      return v/3;
    }
    const cellW = Math.max(8,Math.round(w*0.04)), cellH = Math.max(8,Math.round(h*0.04));
    const cols = Math.floor(w/cellW), rows = Math.floor(h/cellH);
    const scores = [];
    for (let r = 0; r < rows; r++) {
      scores[r] = [];
      for (let c = 0; c < cols; c++) {
        const x1=c*cellW, y1=r*cellH, x2=Math.min(w,x1+cellW), y2=Math.min(h,y1+cellH);
        const variance = varRect(x1,y1,x2,y2);
        const edgeDensity = sumRect(edgeInt,w,x1,y1,x2,y2)/((x2-x1)*(y2-y1));
        scores[r][c] = Math.min(1,variance/2000)*Math.min(1,edgeDensity/60);
      }
    }
    const thresh = 0.08;
    const visited = new Uint8Array(rows*cols);
    const clusters = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (visited[r*cols+c] || scores[r][c] < thresh) continue;
        let minR=r,maxR=r,minC=c,maxC=c;
        const stack = [[r,c]]; visited[r*cols+c] = 1;
        while (stack.length) {
          const [cr,cc] = stack.pop();
          minR=Math.min(minR,cr); maxR=Math.max(maxR,cr); minC=Math.min(minC,cc); maxC=Math.max(maxC,cc);
          for (const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
            const nr=cr+dr, nc=cc+dc;
            if (nr>=0&&nr<rows&&nc>=0&&nc<cols&&!visited[nr*cols+nc]&&scores[nr][nc]>=thresh) {
              visited[nr*cols+nc]=1; stack.push([nr,nc]);
            }
          }
        }
        clusters.push({x1:minC*cellW, y1:minR*cellH, x2:Math.min(w,(maxC+1)*cellW), y2:Math.min(h,(maxR+1)*cellH)});
      }
    }
    const candidates = [];
    for (const cl of clusters) {
      const bw=cl.x2-cl.x1, bh=cl.y2-cl.y1, area=bw*bh;
      if (area<0.003*imgArea||area>0.7*imgArea) continue;
      if (bw/bh<0.3||bw/bh>4) continue;
      let totalScore=0, count=0;
      for (let r = Math.floor(cl.y1/cellH); r < Math.ceil(cl.y2/cellH)&&r<rows; r++) {
        for (let c = Math.floor(cl.x1/cellW); c < Math.ceil(cl.x2/cellW)&&c<cols; c++) {
          totalScore += scores[r][c]; count++;
        }
      }
      const score = Math.min(1, totalScore/Math.max(1,count)*3);
      if (score > 0.15) candidates.push({x:cl.x1*ow/w, y:cl.y1*oh/h, bw:bw*ow/w, bh:bh*oh/h, score});
    }
    return candidates;
  }
  function detectPlaceholders(imageData, origW, origH) {
    const w=imageData.width, h=imageData.height, imgArea=w*h;
    const data=imageData.data, gray=grayscale(data), {gx,gy,mag}=sobelSeparated(gray,w,h);
    const edgeInt=buildIntegral(mag,w,h), grayInt=buildIntegral(gray,w,h);
    const lineCand=detectByLines(gx,gy,edgeInt,grayInt,w,h,origW,origH,imgArea);
    const contentCand=detectByContent(data,edgeInt,w,h,origW,origH,imgArea);
    const all=[...lineCand,...contentCand];
    const merged=nms(all,0.35).sort((a,b)=>b.score-a.score).slice(0,12);
    return {
      placeholders: merged.map((c,i)=>({
        id:"placeholder_"+(i+1), label:"Image Placeholder", type:"image", shape:"rectangle",
        confidence:Math.round(c.score*100)/100, rotation:0,
        x:Math.round((c.x/origW)*10000)/10000, y:Math.round((c.y/origH)*10000)/10000,
        width:Math.round((c.bw/origW)*10000)/10000, height:Math.round((c.bh/origH)*10000)/10000,
      })),
      template_width:origW, template_height:origH,
    };
  }
  // ---- App ----
  const dropzone=document.getElementById('dropzone'), fileInput=document.getElementById('fileInput');
  const statusEl=document.getElementById('status'), errorEl=document.getElementById('error'), resultEl=document.getElementById('result');
  let analysis=null, imageUrl=null, filledImages={}, detector='api', loading=false;
  function loadImageFromFile(file){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);});}
  function runClientDetection(img){
    const c=document.createElement('canvas');const maxDim=600;const s=Math.min(maxDim/img.naturalWidth,maxDim/img.naturalHeight,1);
    c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);
    return detectPlaceholders(ctx.getImageData(0,0,c.width,c.height),img.naturalWidth,img.naturalHeight);
  }
  function setStatus(t){statusEl.innerHTML='<p class="spinner">'+t+'</p>';}
  function clearStatus(){statusEl.innerHTML='';}
  function setError(t){errorEl.innerHTML='<div class="alert alert-error">'+t+'</div>';}
  function clearError(){errorEl.innerHTML='';}
  function handleFile(file){
    if(!file||!file.type.startsWith('image/'))return;
    clearError();resultEl.innerHTML='';filledImages={};imageUrl=URL.createObjectURL(file);analysis=null;
    loading=true;setStatus('Analyzing template...');dropzone.classList.add('disabled');
    (async()=>{
      try{
        const fd=new FormData();fd.append('image',file);
        const r=await fetch('http://localhost:8000/api/analyze-template',{method:'POST',body:fd});
        if(!r.ok)throw new Error((await r.json()).detail||'Analysis failed');
        analysis=await r.json();detector='api';
      }catch{
        const img=await loadImageFromFile(file);setStatus('Running browser detection...');
        await new Promise(r=>setTimeout(r,10));analysis=runClientDetection(img);detector='browser';
      }finally{loading=false;clearStatus();dropzone.classList.remove('disabled');render();}
    })();
  }
  function render(){
    if(!analysis||!imageUrl)return;
    if(analysis.placeholders.length===0){resultEl.innerHTML='<div class="alert alert-warn">No image placeholders detected.</div>';return;}
    const phs=analysis.placeholders,fillCount=Object.keys(filledImages).length;
    let h='<div class="editor-area"><div class="badge">Detected via '+(detector==='api'?'backend AI':'browser')+' &middot; '+phs.length+' placeholder(s) found</div>';
    h+='<div class="image-container"><img src="'+imageUrl+'" alt="Template"/>';
    h+='<input type="file" id="fillInput" accept="image/*" style="display:none"/>';
    for(const p of phs){const f=filledImages[p.id];
      h+='<div class="placeholder-box '+(f?'filled':'')+'" data-id="'+p.id+'" style="left:'+(p.x*100)+'%;top:'+(p.y*100)+'%;width:'+(p.width*100)+'%;height:'+(p.height*100)+'%">';
      if(!f)h+='<div class="placeholder-plus">+</div>';h+='</div>';
      if(f)h+='<img src="'+f+'" class="placeholder-filled" data-id="'+p.id+'" style="left:'+(p.x*100)+'%;top:'+(p.y*100)+'%;width:'+(p.width*100)+'%;height:'+(p.height*100)+'%"/>';
      h+='<span class="placeholder-label" style="left:'+(p.x*100)+'%;top:calc('+(p.y*100)+'% - 20px)">'+p.label+' ('+Math.round(p.confidence*100)+'%)</span>';
    }
    h+='</div>';
    if(fillCount>0)h+='<button class="download-btn" id="downloadBtn">Download Edited Template</button>';
    h+='<details><summary>Raw JSON Response</summary><pre>'+htmlEscape(JSON.stringify(analysis,null,2))+'</pre></details></div>';
    resultEl.innerHTML=h;
    const fi=document.getElementById('fillInput');let pf=null;
    document.querySelectorAll('.placeholder-box,.placeholder-filled').forEach(e=>{e.addEventListener('click',function(){pf=this.dataset.id;fi.click();});});
    fi.addEventListener('change',function(){const f=this.files[0];if(!f||!pf)return;const r=new FileReader();r.onload=function(){filledImages[pf]=r.result;render();};r.readAsDataURL(f);this.value='';});
    const db=document.getElementById('downloadBtn');if(db)db.addEventListener('click',handleDownload);
  }
  function htmlEscape(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  async function handleDownload(){
    if(!analysis||!imageUrl)return;
    const c=document.createElement('canvas');c.width=analysis.template_width;c.height=analysis.template_height;
    const ctx=c.getContext('2d');const t=await loadImage(imageUrl);ctx.drawImage(t,0,0);
    for(const p of analysis.placeholders){
      const du=filledImages[p.id];if(!du)continue;
      const img=await loadImage(du);const x=p.x*analysis.template_width,y=p.y*analysis.template_height,w=p.width*analysis.template_width,h=p.height*analysis.template_height;
      ctx.save();if(p.shape==='circle'){ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);ctx.clip();}
      ctx.drawImage(img,x,y,w,h);ctx.restore();
    }
    c.toBlob(function(b){if(!b)return;const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='template-edited.png';a.click();URL.revokeObjectURL(u);},'image/png');
  }
  function loadImage(s){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=s;});}
  dropzone.addEventListener('click',function(e){if(e.target.tagName!=='INPUT'&&!loading)fileInput.click();});
  dropzone.addEventListener('dragover',function(e){e.preventDefault();if(!loading)this.classList.add('dragover');});
  dropzone.addEventListener('dragleave',function(){this.classList.remove('dragover');});
  dropzone.addEventListener('drop',function(e){e.preventDefault();this.classList.remove('dragover');if(!loading)handleFile(e.dataTransfer.files[0]);});
  fileInput.addEventListener('change',function(){handleFile(this.files[0]);this.value='';});
})();
</script>
</body>
</html>
